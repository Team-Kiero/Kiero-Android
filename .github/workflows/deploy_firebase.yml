name: Deploy to Firebase App Distribution (main)

on:
  push:
    branches: [ main ]

jobs:
  distribute-parent:
    name: Build & Distribute Parent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Restore debug keystore
        run: |
          mkdir -p /home/runner/.android
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > /home/runner/.android/debug.keystore

      # 빌드를 위해 gradle에 선언된 키들을 설정
      - name: Create local.properties from secret
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          printf "%s" "$LOCAL_PROPERTIES" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Create google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Create Firebase service account file from secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > fastlane/firebase-service-account.json

      - name: Grant permission to gradlew
        run: chmod +x ./gradlew

      - name: Distribute parent app via Fastlane
        env:
          FIREBASE_APP_ID_PARENT: ${{ secrets.FIREBASE_APP_ID_PARENT }}
        run: bundle exec fastlane distribute_parent
